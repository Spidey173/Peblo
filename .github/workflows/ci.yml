name: Peblo CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-backend:
    name: Backend Lint, Migrate & Pytest (Postgres + pgvector)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: peblo
          POSTGRES_PASSWORD: peblo
          POSTGRES_DB: peblo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint with Ruff
        run: ruff check backend/

      - name: Run Alembic Migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://peblo:peblo@localhost:5432/peblo
          DIRECT_URL: postgresql+psycopg://peblo:peblo@localhost:5432/peblo
        run: alembic upgrade head

      - name: Run Pytest Suite with Coverage
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key-32-chars-long
          DATABASE_URL: postgresql+psycopg://peblo:peblo@localhost:5432/peblo
          TEST_DATABASE_URL: postgresql+psycopg://peblo:peblo@localhost:5432/peblo
          GROQ_API_KEY: mock_key_for_ci
        run: |
          PYTHONPATH=. pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=70

  build-frontend:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Run Vite Build
        working-directory: frontend
        run: npm run build
